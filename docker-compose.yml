networks:
  db_network:
    driver: bridge

services:
  cam_tor_lane1:
    container_name: Cam_Tor_Lane1
    build:
      context: ./Cam_Tor_Lane1
      dockerfile: Dockerfile
    volumes:
      - ./Cam_Tor_Lane1/data:/app/data
    networks:
      - db_network

  cam_tor_lane2:
